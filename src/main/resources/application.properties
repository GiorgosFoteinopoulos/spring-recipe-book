spring.application.name=recipes

# Database: settings come from environment variables. The values after ":" are local defaults.
# Port 5434 = the recipes database container.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/recipes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.open-in-view=false
