<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${recipe.title}">Recipe</title>
    <style>
        .error { color: #b00020}
        .field-error { border: 2px solid #b00020;}
    </style>
</head>
<body>

<p><a th:href="@{/recipes}">&larr; All recipes</a></p>

<h1 th:text="${recipe.title}">Recipe title</h1>

<p>
    Serves <strong th:text="${recipe.servings}">2</strong>
    &middot;  Ready in <strong th:text="${recipe.prepMinutes} + ' min'">15 min</strong>
</p>

<div>
    <a th:href="@{/recipes/{id}/edit(id=${recipe.id})}">Edit recipe</a>
    <form th:action="@{/recipes/{id}/delete(id=${recipe.id})}" method="post" style="display:inline">
        <button type="submit" onclick="return confirm('Delete this recipe and all its ingredients?')">
            Delete recipe
        </button>
    </form>
</div>

<h2>Ingredients</h2>

<p th:if="${recipe.ingredients.isEmpty()}">No ingredients listed.</p>

<ul th:unless="${recipe.ingredients.isEmpty()}">
    <li th:each="ingredient : ${recipe.ingredients}">
        <span th:text="${ingredient.amount}">200 g</span>
        <span th:text="${ingredient.name}">Feta</span>

        <form th:action="@{/recipes/{id}/ingredients/{ingredientId}/delete(id=${recipe.id}, ingredientId=${ingredient.id})}" method="post" style="display:inline">
            <button type="submit">Remove</button>
        </form>
    </li>
</ul>

<h3>Add an ingredient</h3>

<form th:action="@{/recipes/{id}/ingredients(id=${recipe.id})}" th:object="${ingredientForm}" method="post" novalidate>

    <input type="text" th:field="*{amount}" th:errorclass="field-error" placeholder="Amount, e.g. 200 g">
    <input type="text" th:field="*{name}" th:errorclass="field-error" placeholder="Ingredient" required>
    <button type="submit">Add</button>
    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
    <div class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Amount error</div>
</form>

<h2>Instructions</h2>

<p style="white-space: pre-line" th:text="${recipe.instructions}">Instructions</p>

</body>
</html>
