<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recipe form</title>
    <style>
        .error {
            color: #b00020;
        }

        .field-error {
            border: 2px solid #b00020;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<h1 th:text="${recipeForm.id == null} ? 'New Recipe' : 'Edit Recipe'">Recipe form</h1>

<form th:action="${recipeForm.id == null} ? @{/recipes} : @{/recipes/{id} (id=${recipeForm.id})}"
      th:object="${recipeForm}"
      method="post"
      novalidate>

    <p class="error" th:if="${#fields.hasAnyErrors()}">Please correct the fields marked below.</p>
    <p>
        <label for="title">Title</label><br>
        <input type="text" id="title" th:field="*{title}" th:errorclass="field-error" required>
        <br><span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</span>
    </p>

    <p>
        <label for="servings">Servings</label><br>
        <input type="number" id="servings" th:field="*{servings}" th:errorclass="field-error" min="1">
        <br><span class="error" th:if="${#fields.hasErrors('servings')}" th:errors="*{servings}">Servings error</span>
    </p>

    <p>
        <label for="prepMinutes">Prep time (minutes)</label><br>
        <input type="number" id="prepMinutes" th:field="*{prepMinutes}" th:errorclass="field-error" min="1">
        <br><span class="error" th:if="${#fields.hasErrors('prepMinutes')}"
                  th:errors="*{prepMinutes}">Prep time error</span>
    </p>

    <p>
        <label for="instructions">Instructions</label><br>
        <textarea id="instructions" th:field="*{instructions}" th:errorclass="field-error" rows="8"
                  cols="60"></textarea>
        <br><span class="error" th:if="${#fields.hasErrors('instructions')}" th:errors="*{instructions}">Instructions error</span>
    </p>

    <button type="submit">Save</button>
    <a th:href="${recipeForm.id == null} ? @{/recipes} : @{/recipes/{id}(id=${recipeForm.id})}">Cancel</a>
</form>

<p th:if="${recipeForm.id == null}"><em>You can add ingredients after saving the recipe.</em></p>
</body>
</html>
