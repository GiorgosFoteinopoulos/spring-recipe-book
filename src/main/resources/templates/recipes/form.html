<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recipe form</title>
</head>
<body>

<h1 th:text="${recipe.id == null} ? 'New Recipe' : 'Edit Recipe'">Recipe form</h1>

<form th:action="${recipe.id == null} ? @{/recipes} : @{/recipes/{id} (id=${recipe.id})}"
      th:object="${recipe}"
      method="post">

    <p>
        <label for="title">Title</label><br>
        <input type="text" id="title" th:field="*{title}" required>
    </p>

    <p>
        <label for="servings">Servings</label><br>
        <input type="number" id="servings" th:field="*{servings}" min="1">
    </p>

    <p>
        <label for="prepMinutes">Prep time (minutes)</label><br>
        <input type="number" id="prepMinutes" th:field="*{prepMinutes}" min="1">
    </p>

    <p>
        <label for="instructions">Instructions</label><br>
        <textarea id="instructions" th:field="*{instructions}"></textarea>
    </p>

    <button type="submit">Save</button>
    <a th:href="${recipe.id == null} ? @{/recipes} : @{/recipes/{id}(id=${recipe.id})}">Cancel</a>
</form>

<p th:if="${recipe.id == null}"><em>You can add ingredients after saving the recipe.</em></p>
</body>
</html>
