<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="header">
    <div th:if="${currentUsername}">
        Logged in as <strong th:text="${currentUsername}">name</strong>
        &middot; <a th:href="@{/recipes}">My recipes</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit">Log out</button>
        </form>
    </div>
    <hr>
    <p th:if="${successMessage}" th:text="${successMessage}" style="color: #1b5e20;">Saved.</p>
</div>

</body>
</html>
