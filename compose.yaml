services:
    db:
        image: postgres:18
        environment:
            POSTGRES_DB: recipes
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5434:5432"
        volumes:
            - recipe-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d recipes"]
            interval: 5s
            timeout: 5s
            retries: 10
volumes:
    recipe-data: